<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注历史 - Lofi Radio Player</title>
    <link rel="stylesheet" href="node_modules/@awesome.me/webawesome/dist-cdn/styles/themes/shoelace.css">
    <link rel="stylesheet" href="subpage-foundation.css">
    <link rel="stylesheet" href="history.css">
</head>
<body class="wa-theme-shoelace wa-palette-shoelace wa-dark">
    <div class="history-page subpage-frame">
        <header class="titlebar subpage-header">
            <div class="subpage-heading">
                <span class="product-label">LOFI RADIO</span>
                <h1>专注历史</h1>
            </div>
            <button class="close-btn" id="closeBtn" type="button" aria-label="关闭">&times;</button>
        </header>

        <main class="history-container">
        <section class="summary-panel" aria-label="专注时长汇总">
            <div class="summary-block">
                <span class="summary-label">今日专注</span>
                <div class="summary-reading">
                    <span class="summary-value" id="summaryToday">0</span>
                    <span class="summary-unit">分钟</span>
                </div>
            </div>
            <div class="summary-divider" aria-hidden="true"></div>
            <div class="summary-block">
                <span class="summary-label" id="summaryPeriod">近 7 天累计</span>
                <div class="summary-reading">
                    <span class="summary-value" id="summaryTotal">0</span>
                    <span class="summary-unit">分钟</span>
                </div>
            </div>
        </section>

        <div class="capsule-group" id="viewToggle">
            <wa-button class="capsule-option active" data-view="week" variant="brand" size="s">过去一周</wa-button>
            <wa-button class="capsule-option" data-view="month" variant="neutral" size="s">过去一月</wa-button>
        </div>

        <section class="chart-container" id="chartContainer" aria-label="专注时长柱状图">
            <div class="chart-placeholder">加载中...</div>
        </section>
        </main>
    </div>

    <script type="module" src="webawesome-components.js"></script>
    <script src="history.js"></script>
</body>
</html>

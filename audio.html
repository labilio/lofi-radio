<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; media-src http: https: blob:; connect-src http: https:; style-src 'self' 'unsafe-inline'"
    >
    <title>Audio Player</title>
    <script src="./node_modules/hls.js/dist/hls.min.js"></script>
</head>
<body>
    <audio id="player" preload="auto"></audio>
    <script src="./audio-runtime.js"></script>
    <script>
        if (window.audioPlayer && window.LofiAudioRuntime) {
            window.LofiAudioRuntime.bootAudioRuntime({
                bridge: window.audioPlayer,
                media: document.getElementById('player'),
                HlsClass: window.Hls
            });
        }
    </script>
</body>
</html>

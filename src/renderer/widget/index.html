<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Radio Widget</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="widget" class="widget" data-focus-text="Today Focus: 0 min">
        <div id="stationListPanel" class="station-list-panel">
            <div class="panel-header">
                <button id="panelBackBtn" class="panel-back-btn" title="返回">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </button>
                <h3 id="stationPanelTitle">选择电台</h3>
            </div>
            <div class="station-list-container">
                <ul id="stationListUl" class="station-list-ul">
                </ul>
            </div>
        </div>

        <button id="stationListBtn" class="station-list-btn" title="切换电台">
            <svg viewBox="0 0 24 24">
                <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
            </svg>
        </button>

        <div class="cover-section">
            <div class="vinyl-record" id="playPauseBtn">
                <div class="record-center">
                    <div class="play-pause-icon">
                        <svg class="play-icon" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="pause-icon" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </div>
                </div>
                <div class="record-label">
                    <div class="label-text">LOFI</div>
                </div>
                <div class="record-grooves"></div>
            </div>
            <div class="info-section">
                <div class="title-section">
                    <h1 class="main-title" id="stationTitle">Lofi Girl</h1>
                    <p class="subtitle">Created by @SecretMaple24</p>
                </div>
                <div class="volume-control">
                    <svg class="volume-icon" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
                </div>
            </div>
        </div>

        <div class="focus-time-display">
            Today Focus: <span id="focusTime">0</span> min
        </div>

        <button id="miniModeBtn" class="mini-mode-btn" title="切换到Mini模式">
            <svg viewBox="0 0 24 24">
                <path d="M19 13H5v-2h14v2z"/>
            </svg>
        </button>

        <button id="miniPlayBtn" class="mini-play-btn" title="播放/暂停">
            <svg class="mini-play-icon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="mini-pause-icon" viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </button>

        <button id="miniExpandBtn" class="mini-expand-btn" title="还原">
            <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>

        <button id="closeBtn" class="close-btn">
            <svg viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
    </div>

    <script src="playback-presentation.js"></script>
    <script src="widget.js"></script>
    <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发现新版本</title>
    <link rel="stylesheet" href="subpage-foundation.css">
    <link rel="stylesheet" href="update.css">
</head>
<body data-state="available">
    <div class="update-page subpage-frame">
        <header class="titlebar subpage-header">
            <div class="subpage-heading">
                <span class="product-label">LOFI RADIO</span>
                <h1 id="updateTitle">发现新版本</h1>
            </div>
            <button class="close-btn" id="closeBtn" type="button" aria-label="关闭">&times;</button>
        </header>

        <main class="update-shell">
            <section aria-labelledby="updateTitle">
            <p class="message">新版本已经发布，可以前往 GitHub 下载。</p>
            </section>

        <div class="version-rail" aria-label="版本对比">
            <div class="version-block">
                <span class="version-caption">当前版本</span>
                <span class="version-value">v<span id="currentVersion"></span></span>
            </div>
            <span class="version-arrow" aria-hidden="true">→</span>
            <div class="version-block is-new">
                <span class="version-caption">可用版本</span>
                <span class="version-value">v<span id="latestVersion"></span></span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="downloadBtn" type="button">前往下载</button>
            <button class="btn btn-secondary" id="viewChangesBtn" type="button">
                查看更新内容
                <svg class="external-link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M14 4h6v6M10 14 20 4M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/>
                </svg>
            </button>
            <button class="btn btn-quiet" id="skipBtn" type="button">跳过此版本</button>
        </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentVersion = urlParams.get('current') || '—';
        const latestVersion = urlParams.get('latest') || '—';
        const releaseUrl = urlParams.get('url');

        document.getElementById('currentVersion').textContent = currentVersion;
        document.getElementById('latestVersion').textContent = latestVersion;

        document.getElementById('downloadBtn').addEventListener('click', () => {
            window.updateAPI?.download(releaseUrl);
        });

        document.getElementById('viewChangesBtn').addEventListener('click', () => {
            window.updateAPI?.viewChanges();
        });

        document.getElementById('skipBtn').addEventListener('click', () => {
            window.updateAPI?.skip(latestVersion);
        });

        document.getElementById('closeBtn').addEventListener('click', () => {
            window.updateAPI?.close();
        });
    </script>
</body>
</html>
